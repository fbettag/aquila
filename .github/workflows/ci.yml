name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run paid live API integration tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.1'
          otp-version: '28.1'
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Lint
        run: mix quality
      - name: Run tests
        run: mix test --exclude live
      - name: Build documentation
        run: MIX_ENV=dev mix docs --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: aquila-docs
          path: doc/
      - name: Test complete application example
        working-directory: examples/support_assistant
        run: |
          mix deps.get
          mix test
          mix run -e 'SupportAssistant.CLI.main([])'

  live-tests:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_tests }}
    env:
      MIX_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DIRECT_API_KEY: ${{ secrets.OPENAI_DIRECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.1'
          otp-version: '28.1'
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Run live tests
        if: ${{ env.OPENAI_API_KEY != '' && env.OPENAI_DIRECT_API_KEY != '' }}
        run: mix test --only live

  publish-docs:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: aquila-docs
          path: doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc
      - name: Deploy current documentation
        id: deployment
        uses: actions/deploy-pages@v4
